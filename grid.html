        #main{
            height: 800px;

            display: grid;
            margin: 100px ;
            grid-template-columns: repeat(4,300px);
            grid-template-rows: repeat(10,300px);
            grid-gap: 10px;
            /* overflow: hidden; */

        #main div{
            /* border: 2px solid ; */

            overflow: hidden;
            
            /* transition-duration: 200ms; */
        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 18px;
            object-fit: cover;
            transition-duration: 200ms;
        }
        h2{
            /* height: 100%; */
            width: 100%;
            margin-left: 20px;
            position: relative;
            top: -50px;
            opacity: 0;
            transition-duration: 200ms;
            
        }

        #main div:hover{
            img{
            opacity: 0.5;
            scale: 1.07;
            }
            h2{
            opacity: 2;
            top: -70px;
        }

            
        }

        #a{
            grid-column: span 2;
        }
