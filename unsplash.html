    <style>
        body{
            background-color: black;
            
        }
        

        
        #main{
            height: 1000px;
            width: 80vw;
            margin: 100px auto;
            /* border: 2px solid red; */
            display: grid;
            grid-template-columns: repeat(3 ,400px);
            grid-template-rows: repeat(6, 250px);
            grid-gap: 15px;
        }
        #main div{
            border: 2px solid;
            border-radius: 20px;
            overflow: hidden;

        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 18px;
            object-fit: cover;
            transition-duration: 200ms;
        }
        h2{
            color: rgb(255, 153, 0);
            position: relative;
            top: -60px;
            margin-left: 10px;
            opacity: 0;
            transition-duration: 200ms;
        }

        #main div:hover{
            img{
            opacity: 0.7;
            scale: 1.09;
            }
            h2{
            opacity: 2;
            top: -70px;
            }
        } 


        .a:nth-child(3){
            grid-row: span 2;
        }

        .a:nth-child(5){
            grid-row: span 2;
        }

        .a:nth-child(6){
            grid-row: span 2;
        }

        .a:nth-child(8){
            grid-row: span 2;
        }

        .a:nth-child(11){
            grid-row: span 2;
        }

        #heading{
            height: 50px;
            background-color: bisque;
            display: flex;
            justify-content: center;
            align-items: center;
            
            
            
        }

        
    </style>
